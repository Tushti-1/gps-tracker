<!DOCTYPE html>
<html>
<head>
  <title>Live Car Tracker</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>#map { height: 90vh; }</style>
</head>
<body>
  <h2 style="text-align:center;">Two-Car Live GPS Tracker</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([22.57, 88.36], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markers = {};
    let colors = { car1: 'blue', car2: 'red' };
    let polylines = { car1: [], car2: [] };

    async function updateMap() {
      const res = await fetch("https://gps-tracker-m2m7.onrender.com/gps/all-latest");
      const data = await res.json();

      ['car1', 'car2'].forEach(car => {
        const carData = data[car];
        if (!carData) return;

        const { latitude, longitude } = carData;

        if (!markers[car]) {
          markers[car] = L.marker([latitude, longitude], {
            icon: L.divIcon({ className: 'custom-icon', html: `<b style="color:${colors[car]}">${car}</b>` })
          }).addTo(map);
        } else {
          markers[car].setLatLng([latitude, longitude]);
        }

        polylines[car].push([latitude, longitude]);
        const path = L.polyline(polylines[car], { color: colors[car] }).addTo(map);
      });
    }

    setInterval(updateMap, 5000);
    updateMap();
  </script>
</body>
</html>
