<!DOCTYPE html>
<html>
<head>
  <title>Live Car Tracker</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 90vh; }
    .custom-icon {
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Two-Car Live GPS Tracker</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([22.57, 88.36], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markers = {};
    let colors = { car1: 'blue', car2: 'red' };
    let polylines = { car1: [], car2: [] };
    let paths = {};  // Store polyline layers to update them without overlap

    async function updateMap() {
      try {
        const res = await fetch("https://gps-tracker-m2m7.onrender.com/gps/all-latest");
        const data = await res.json();

        const bounds = [];

        ['car1', 'car2'].forEach(car => {
          const carData = data[car];
          if (!carData) return;

          const { latitude, longitude } = carData;
          const latlng = [latitude, longitude];
          bounds.push(latlng);

          // Marker handling
          if (!markers[car]) {
            markers[car] = L.marker(latlng, {
              icon: L.divIcon({ className: 'custom-icon', html: `<b style="color:${colors[car]}">${car}</b>` })
            }).addTo(map);
          } else {
            markers[car].setLatLng(latlng);
          }

          // Path handling
          polylines[car].push(latlng);
          if (paths[car]) {
            map.removeLayer(paths[car]);  // Remove old path
          }
          paths[car] = L.polyline(polylines[car], { color: colors[car] }).addTo(map);
        });

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      } catch (err) {
        console.error("Error updating map:", err);
      }
    }

    updateMap();
    setInterval(updateMap, 5000);
  </script>
</body>
</html>
